spring.application.name=ai-assistant-service
server.port=${SERVER_PORT:8084}

# Health monitoring & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}

# Downstream Service URLs for AI Assistant Tools
services.gateway.url=${GATEWAY_URL:http://localhost:8080}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.parcel.url=${PARCEL_SERVICE_URL:http://localhost:8082}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8083}

# JWT Secret (for inter-service authorization verification)
jwt.secret=${JWT_SECRET}